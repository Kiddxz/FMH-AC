<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    FMH Animal Clinic | Log In
  </title>

  <link rel="stylesheet" href="animal.css">

  <script src="animal.js" defer></script>

</head>

<body class="login-page">

  <header>

    <h2 class="logo">
      🐾 FMH Animal Clinic
    </h2>

  </header>

  <main class="login-container">

    <div class="login-card">

      <h1>
        Welcome Back!
      </h1>

      <p class="login-description">
        Sign in to continue to your account.
      </p>

      <form id="loginForm">

        <div class="form-group">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            autocomplete="email"
            required
          >

        </div>

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>

        <div class="login-options">

          <label class="rememberme">

            <input
              type="checkbox"
              id="rememberme"
              name="rememberme"
            >

            Remember Me

          </label>

          <a href="forgotpass.html">
            Forgot Password
          </a>

        </div>

        <button
          class="loginbtn"
          type="submit"
        >
          Login
        </button>

      </form>

      <div class="divider">

        <span>
          OR
        </span>

      </div>

      <div class="register">

        <p>

          Don't have an account?

          <a href="register.html">
            Create Account
          </a>

        </p>

      </div>

      <a
        href="home.html"
        class="back-home"
      >
        ← Back to Home
      </a>

    </div>

  </main>

</body>

</html>
