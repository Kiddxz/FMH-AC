<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    FMH Animal Clinic | Assistant Logout
  </title>

  <link rel="stylesheet" href="animal.css">

</head>

<body class="admin-layout">

  <header class="admin-header">

    <div class="logo">
      🐾 FMH Animal Clinic
    </div>

    <nav class="admin-nav">

      <a href="assistantdashboard.html">
        Dashboard
      </a>

      <a href="assistantappointments.html">
        Appointments
      </a>

      <a href="assistantpets.html">
        Pets
      </a>

      <a href="assistantpetrecords.html">
        Pet Records
      </a>

      <a href="assistantprofile.html">
        Profile
      </a>

      <a
        href="assistantlogout.html"
        class="active"
      >
        Logout
      </a>

    </nav>

  </header>

  <main class="admin-container">

    <div class="admin-table-card">

      <div class="admin-panel-header">

        <div>

          <h2>
            Logout
          </h2>

          <p>
            Are you sure you want to log out of your assistant account?
          </p>

        </div>

      </div>

      <div class="admin-tools">

        <button
          class="admin-add-btn"
          type="button"
          onclick="window.location.href='assistantlogin.html'"
        >
          Yes, Logout
        </button>

        <button
          class="action-view"
          type="button"
          onclick="window.location.href='assistantdashboard.html'"
        >
          Cancel
        </button>

      </div>

    </div>

  </main>

  <footer>
    © 2026 FMH Animal Clinic | Assistant Panel
  </footer>

</body>

</html>
