<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    FMH Animal Clinic | Admin Login
  </title>


  <link rel="stylesheet" href="animal.css">

</head>


<body class="admin-page">


  <div class="account-container">


    <div class="account-card">


      <div class="account-logo">

        🐾 FMH Animal Clinic

      </div>


      <h1>
        Admin Login
      </h1>


      <p class="account-subtitle">
        Sign in to manage the animal clinic system.
      </p>


      <form
        action="admindashboard.html"
        method="get"
      >


        <div class="input-group">

          <label for="adminemail">
            Admin Email
          </label>


          <input
            type="email"
            id="adminemail"
            name="adminemail"
            placeholder="Enter your admin email"
            autocomplete="email"
            required
          >

        </div>


        <div class="input-group">

          <label for="adminpassword">
            Password
          </label>


          <input
            type="password"
            id="adminpassword"
            name="adminpassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>


        <div class="login-options">

          <label>

            <input
              type="checkbox"
              name="remember"
            >

            Remember Me

          </label>


          <a href="forgotpass.html">
            Forgot Password?
          </a>

        </div>


        <button
          type="submit"
          class="loginbtn"
        >
          Login
        </button>


      </form>


      <div class="account-divider">

        <span>
          OR
        </span>

      </div>


      <a
        href="login.html"
        class="admin-login-link"
      >
        Login as Pet Owner
      </a>


      <a
        href="home.html"
        class="back-home"
      >
        ← Back to Home
      </a>


    </div>


  </div>


</body>

</html>
