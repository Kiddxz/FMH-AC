<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    FMH Animal Clinic | New Appointment
  </title>

  <link rel="stylesheet" href="animal.css">

</head>

<body class="admin-layout">

  <header class="admin-header">

    <div class="logo">
      🐾 FMH Animal Clinic
    </div>

    <nav class="admin-nav">

      <a href="admindashboard.html">
        Dashboard
      </a>

      <a
        href="adminappointments.html"
        class="active"
      >
        Appointments
      </a>

      <a href="adminpets.html">
        Pets
      </a>

      <a href="adminusers.html">
        Users
      </a>

      <a href="adminservices.html">
        Services
      </a>

      <a href="adminlogout.html">
        Logout
      </a>

    </nav>

  </header>

  <main class="admin-container">

    <div class="admin-page-heading">

      <div>

        <h1>
          New Appointment
        </h1>

        <p>
          Create a new veterinary appointment for a pet.
        </p>

      </div>

    </div>

    <div class="appointment-form-card">

      <form
        action="adminappointments.html"
        method="get"
      >

        <div class="appointment-form-row">

          <div class="appointment-form-group">

            <label for="owner">
              Pet Owner
            </label>

            <input
              type="text"
              id="owner"
              name="owner"
              placeholder="Enter pet owner's name"
              required
            >

          </div>

          <div class="appointment-form-group">

            <label for="pet">
              Pet Name
            </label>

            <input
              type="text"
              id="pet"
              name="pet"
              placeholder="Enter pet's name"
              required
            >

          </div>

        </div>

        <div class="appointment-form-row">

          <div class="appointment-form-group">

            <label for="service">
              Service
            </label>

            <select
              id="service"
              name="service"
              required
            >

              <option value="">
                Select Service
              </option>

              <option value="Consultation">
                Consultation
              </option>

              <option value="Vaccination">
                Vaccination
              </option>

              <option value="Grooming">
                Grooming
              </option>

            </select>

          </div>

          <div class="appointment-form-group">

            <label for="status">
              Status
            </label>

            <select
              id="status"
              name="status"
              required
            >

              <option value="">
                Select Status
              </option>

              <option value="Pending">
                Pending
              </option>

              <option value="Confirmed">
                Confirmed
              </option>

              <option value="Completed">
                Completed
              </option>

              <option value="Cancelled">
                Cancelled
              </option>

            </select>

          </div>

        </div>

        <div class="appointment-form-row">

          <div class="appointment-form-group">

            <label for="date">
              Appointment Date
            </label>

            <input
              type="date"
              id="date"
              name="date"
              required
            >

          </div>

          <div class="appointment-form-group">

            <label for="time">
              Appointment Time
            </label>

            <input
              type="time"
              id="time"
              name="time"
              required
            >

          </div>

        </div>

        <div class="appointment-form-group">

          <label for="notes">
            Notes
          </label>

          <textarea
            id="notes"
            name="notes"
            rows="5"
            placeholder="Enter additional notes or concerns..."
          ></textarea>

        </div>

        <div class="appointment-form-actions">

          <a
            href="adminappointments.html" class="appointment-cancel-btn">
            Cancel
          </a>

          <button
            type="submit"
            class="appointment-save-btn"
          >
            Save Appointment
          </button>

        </div>

      </form>

    </div>

  </main>

  <footer>
    © 2026 FMH Animal Clinic | Admin Panel
  </footer>

</body>

</html>
