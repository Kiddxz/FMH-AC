<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    FMH Animal Clinic | Super Admin Login
  </title>

  <link rel="stylesheet" href="animal.css">

  <script src="animal.js" defer></script>

</head>

<body class="superadmin-login-page">

  <main class="superadmin-login-container">

    <div class="superadmin-login-card">

      <div class="superadmin-login-logo">
        🐾 FMH Animal Clinic
      </div>

      <div class="superadmin-login-icon">
        🛡️
      </div>

      <h1>
        Super Admin Login
      </h1>

      <p class="superadmin-login-description">
        Sign in to manage system-level functions.
      </p>

      <form id="superAdminLoginForm">

        <div class="form-group">

          <label for="superAdminEmail">
            Email Address
          </label>

          <input
            type="email"
            id="superAdminEmail"
            name="email"
            placeholder="Enter your email address"
            required
          >

        </div>

        <div class="form-group">

          <label for="superAdminPassword">
            Password
          </label>

          <input
            type="password"
            id="superAdminPassword"
            name="password"
            placeholder="Enter your password"
            required
          >

        </div>

        <button
          type="submit"
          class="superadmin-login-btn"
        >
          Login
        </button>

      </form>

      <div class="superadmin-login-back">

        <a href="home.html">
          ← Back to Home
        </a>

      </div>

    </div>

  </main>

</body>

</html>
