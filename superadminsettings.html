  <header class="superadmin-header">

    <div class="logo">
      🐾 FMH Animal Clinic
    </div>

    <nav class="superadmin-nav">

      <a href="superadmindashboard.html">
        Dashboard
      </a>

      <a href="superadminusers.html">
        Users
      </a>

      <a href="superadminappointments.html">
        Appointments

      <a href="superadminpetrecords.html">

      <a href="superadminwaivers.html">

      <a href="superadminpos.html">

      <a href="superadmintransactions.html">

      <a href="superadmininventory.html">

        class="active"
      >
        Settings

      <a href="superadminlogout.html">
        Logout
      </a>

    </nav>

  </header>

  <main class="superadmin-container">

    <div class="superadmin-page-heading">

      <div>

        <h1>
          System Settings
        </h1>

        <p>
          Maintain the settings of the FMH Animal Clinic system.
        </p>

      </div>

    </div>

    <div class="superadmin-settings-card">

      <div class="form-group">

        <label for="clinicName">
          Clinic Name
        </label>

        <input
          type="text"
          id="clinicName"
          value="FMH Animal Clinic"
        >

      </div>

      <div class="form-group">

        <label for="clinicAddress">
          Clinic Address
        </label>

        <input
          type="text"
          id="clinicAddress"
          value="Las Piñas City"
        >

      </div>

      <div class="form-group">

        <label for="clinicContact">
          Contact Number
        </label>

        <input
          type="text"
          id="clinicContact"
          value="0932-314-5969"
        >

      </div>

      <div class="form-group">

        <label for="systemStatus">
          System Status
        </label>

        <select id="systemStatus">

          <option value="active">
            Active
          </option>

          <option value="maintenance">
            Maintenance
          </option>

        </select>

      </div>

      <button
        type="button"
        class="superadmin-add-btn"
        id="saveSettingsBtn"
      >
        Save Settings
      </button>

      <div
        class="superadmin-message"
        id="settingsMessage"
      ></div>

    </div>

  </main>

  <footer>
    © 2026 FMH Animal Clinic | Super Admin Panel
  </footer>

</body>
